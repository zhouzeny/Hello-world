<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>后台登录 - 社会痛点平台</title>
  <link rel="stylesheet" href="/assets/site.css" />
  <script>
    window.APP_CONFIG = {
      apiBase: ""
    };
  </script>
  <script src="/assets/admin.js" defer></script>
</head>
<body>
  <div class="auth-wrap">
    <section class="auth-grid">
      <article class="panel auth-copy">
        <span class="kicker">后台模式</span>
        <h2>这是单独的后台登录页，不和客户提交页共用</h2>
        <p>
          这个页面只负责管理员登录。登录成功后进入后台控制台，用来查看统计、处理反馈和生成报告。
        </p>
        <div class="subgrid" style="margin-top: 22px;">
          <article class="panel card">
            <span class="pill">独立入口</span>
            <h4>后台单独打开</h4>
            <p>客户提交页不会出现后台组件。</p>
          </article>
          <article class="panel card">
            <span class="pill">登录后</span>
            <h4>进入控制台</h4>
            <p>登录后保存 token，并直接进入后台页面。</p>
          </article>
          <article class="panel card">
            <span class="pill">示例账号</span>
            <h4>admin / admin123</h4>
            <p>这是当前后端内置的测试管理员账号。</p>
          </article>
        </div>
      </article>

      <article class="panel auth-card">
        <h3>管理员登录</h3>
        <p class="helper">请输入账号、密码和验证码。</p>

        <form data-admin-login-form>
          <div class="field" style="margin-bottom: 14px;">
            <label for="username">账号</label>
            <input id="username" name="username" type="text" autocomplete="username" placeholder="请输入管理员账号" required />
          </div>

          <div class="field" style="margin-bottom: 14px;">
            <label for="password">密码</label>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required />
          </div>

          <div class="field" style="margin-bottom: 16px;">
            <label for="captcha">验证码</label>
            <div class="captcha-row">
              <input id="captcha" name="captcha" type="text" placeholder="请输入验证码" data-captcha-input required />
              <div class="captcha-box" data-captcha-display>----</div>
            </div>
            <button class="btn ghost" type="button" data-refresh-captcha>刷新验证码</button>
          </div>

          <div class="form-actions">
            <button class="btn primary" type="submit">进入后台</button>
          </div>

          <div class="status" data-login-status></div>
        </form>
      </article>
    </section>
  </div>
</body>
</html>
